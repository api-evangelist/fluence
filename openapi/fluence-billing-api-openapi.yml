              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token: []
      - api_key:
        - billing:top_up
      summary: Create top up request
      x-summary-source: derived
  /v1/billing/top_up/pending:
    get:
      tags:
      - Billing
      operationId: Get pending top-up
      responses:
        '200':
          description: Get pending top-up request
          content:
            application/json:
