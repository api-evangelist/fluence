          format: int64
      - name: maxAmount
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TopUpSortFieldDto'
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrderDto'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: u-int64
          minimum: 0
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
          format: u-int64
          minimum: 0
      responses:
        '200':
          description: Get billing history
