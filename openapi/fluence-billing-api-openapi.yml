  /v2/top-ups/{intent_id}:
    delete:
      tags:
      - Billing
      operationId: cancel_top_up_v2
      parameters:
      - name: intent_id
        in: path
        description: Top-up intent to cancel
        required: true
        schema:
          $ref: '#/components/schemas/IntentId'
      responses:
        '204':
          description: Top-up intent canceled
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
