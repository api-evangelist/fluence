openapi: 3.2.0
info:
  title: Fluence Billing API
  description: '# Introduction


    The Fluence API gives programmatic access to the decentralized Fluence compute marketplace, letting you find, rent, and

    manage compute resources without the web UI.'
  contact:
    name: Cloudless Labs
  license:
    name: AGPL-3
    identifier: AGPL-3
  version: 0.10.0
security:
- api_key: []
tags:
- name: Billing
  description: Billing and payment related endpoints
paths:
  /v1/billing/charges/aggregated:
    get:
      tags:
      - Billing
      description: Aggregated charges over a date range. `startDate` is inclusive, `endDate` is inclusive (charges through the end of the `endDate` day are included). Optional `groupBy`/`period` control the aggregation dimension and time bucket; both default to the fixed per-resource grouping.
      operationId: get_aggregated_charges
      parameters:
      - name: resourceId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ResourceId'
      - name: resourceType
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ResourceTypeDto'
      - name: startDate
        in: query
        description: Start of the range, inclusive (charges from the start of this day).
        required: true
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        description: 'End of the range, inclusive: charges through the end of the endDate day

          are included.'
        required: true
        schema:
          type: string
          format: date
      - name: format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ResponseOutputFormat'
      - name: groupBy
        in: query
        description: Resource dimension to aggregate by. Defaults to the per-resource tuple.
        required: false
        schema:
          $ref: '#/components/schemas/ChargeGroupByDto'
      - name: period
        in: query
        description: Time bucket to split aggregates into. Defaults to no time split.
        required: false
        schema:
          $ref: '#/components/schemas/ChargePeriodDto'
      responses:
        '200':
          description: Aggregated charges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TotalChargesEntry'
            text/csv:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token: []
      - api_key:
        - billing:get_spending_history
      summary: Get aggregated charges
      x-summary-source: derived
  /v1/billing/charges/total:
    get:
      tags:
      - Billing
      operationId: get_total_charges
      parameters:
      - name: resourceId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ResourceId'
      - name: resourceType
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ResourceTypeDto'
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotalChargesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token: []
      - api_key:
        - billing:get_spending_history
      summary: Get total charges
      x-summary-source: derived
  /v1/billing/top_up:
    post:
      tags:
