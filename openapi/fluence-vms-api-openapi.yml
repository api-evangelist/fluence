        required: true
        schema:
          type: string
          format: uuid
      - name: interface_id
        in: path
        description: The ID of the network interface to assign security group to
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Update network interface of user vm
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNetworkInterfaceRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVmDto'
        '400':
          description: Bad Request
          content:
            application/json:
