              createdAt:
                type: string
                format: date-time
              dataDisks:
                type: array
                items:
                  $ref: '#/components/schemas/UserStorageId'
              expanded:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/UserVmExpandedDto'
                  description: Inlined attached resources, present only for fields named in `?expand=`.
              id:
                $ref: '#/components/schemas/UserVmId'
              lastPaidAt:
                type:
                - string
                - 'null'
                format: date-time
              name:
                type: string
              networkInterfaces:
                type: array
                items:
                  $ref: '#/components/schemas/UserVmNetworkInterfaceId'
              paidUntil:
                type:
                - string
                - 'null'
                format: date-time
              priceHourlyUsd:
                type:
                - string
                - 'null'
                description: 'Request-time hourly price snapshot in USD, serialized as a string;

                  absent when the catalog has no active price for this resource. A UI

