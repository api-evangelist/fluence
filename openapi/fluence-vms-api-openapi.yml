                example: '36.50'
              publicIp:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/UserPublicIpId'
              ramGb:
                type:
                - integer
                - 'null'
                format: u-int64
                description: RAM in GB (decimal) of the VM's configuration. See `configuration_name`.
