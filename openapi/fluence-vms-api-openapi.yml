components:
  schemas:
    NetworkInterfaceKindDto:
      oneOf:
      - type: object
        required:
        - private
        properties:
          private:
            type: object
            required:
            - subnet
            properties:
              subnet:
                $ref: '#/components/schemas/UserSubnetId'
      - type: object
        required:
        - public
        properties:
          public:
            type: object
            required:
            - public_ip
            properties:
              public_ip:
                $ref: '#/components/schemas/UserPublicIpId'
    UserPublicIpStatusDto:
      type: string
      enum:
      - new
      - created
      - ready
      - failed
      - removing
      - removed
    StorageRoleDto:
      type: string
      enum:
      - BOOT
      - DATA
    VmConfigurationSlug:
      type: string
      enum:
      - cpu-regular-2vcpu-4gb
      - cpu-regular-4vcpu-8gb
      - cpu-regular-8vcpu-16gb
      - cpu-regular-8vcpu-32gb
      - cpu-regular-16vcpu-32gb
      - cpu-regular-24vcpu-48gb
      - cpu-regular-32vcpu-64gb
      - cpu-regular-64vcpu-128gb
      - cpu-premium-2vcpu-4gb
      - cpu-premium-4vcpu-8gb
      - cpu-premium-8vcpu-16gb
      - cpu-premium-8vcpu-32gb
      - cpu-premium-16vcpu-32gb
      - cpu-premium-24vcpu-48gb
      - cpu-premium-32vcpu-64gb
      - cpu-premium-64vcpu-128gb
      - cpu-shared-2vcpu-2gb
      - cpu-shared-3vcpu-4gb
      - cpu-shared-4vcpu-8gb
      - cpu-shared-8vcpu-16gb
      - cpu-shared-16vcpu-32gb
    NewStorageType:
      type: string
      enum:
      - NVME
    NewIpAddressType:
      type: string
      enum:
      - V4
    VmConfigurationId:
      type: string
      format: uuid
    AddStoragesRequest:
      type: object
      required:
      - dataDisks
      properties:
        dataDisks:
          type: array
          items:
            $ref: '#/components/schemas/UserStorageId'
    CreateUserStorageRequest:
      type: object
      required:
      - clusterId
      - name
      - storageType
      - volumeGb
      - replicated
      properties:
        clusterId:
          $ref: '#/components/schemas/ClusterId'
        name:
          type: string
        osImage:
          type:
          - string
          - 'null'
          example: https://example.com/image.qcow2
        replicated:
          type: boolean
        storageType:
          $ref: '#/components/schemas/NewStorageType'
        volumeGb:
          type: integer
          format: u-int32
          minimum: 0
    ErrorCode:
      type: string
      description: 'Stable, machine-readable error code carried by every non-2xx response.


        Clients should branch on `code` rather than parsing the human-readable

        `error` string. Status-derived variants cover any error that does not

        supply a more specific code; semantic variants are set explicitly at the

        construction site (see `VodopadError::code`).'
      enum:
      - bad_request
      - unauthorized
      - forbidden
      - not_found
      - conflict
      - unprocessable_entity
      - not_acceptable
      - insufficient_balance
      - service_unavailable
      - internal_server_error
    UserPublicIpId:
      type: string
      format: uuid
    UserStorageStatusDto:
      type: string
      enum:
      - new
      - created
      - ready
      - updating
      - failed
      - removing
      - removed
    ConsoleAccessToken:
      type: object
      description: 'Wire-shape returned to Pult. Identical to the response of the previous

        vodopad mint endpoint, which proxied through crd-api

        for the opaque token; only the contents of `token` change here (opaque

        short string → RS256 JWT). Pult treats it as a bearer it forwards to

        vm-api and never parses it.'
      required:
      - token
      - vmApiDomain
      - workspaceId
      - expiresAt
      properties:
        expiresAt:
          type: string
          format: date-time
          description: 'Absolute expiration of the JWT, mirrored from the `exp` claim so the

            client can preemptively re-mint.'
        token:
          type: string
          description: 'RS256 JWT signed with the vodopad `JwtService` RSA key, audience

            `lightmare-vm-api`, issuer `vodopad`. Carries `{sub, vm_id,

            workspace_id, iat, exp, aud, iss}` — see

            [`crate::api::auth::types::VmAccessClaims`].'
        vmApiDomain:
          type: string
          description: 'Public base URL of lightmare vm-api for the cluster this VM lives

            on. Pult builds the attach URL from this + the JWT. Sourced from

            `clusters.vm_api_domain` (migration 1147); if

            the cluster row has NULL the handler answers 503.'
        workspaceId:
          type: string
          format: uuid
          description: 'Workspace the JWT is scoped to — mirrored from the `workspace_id`

            claim. vm-api compares this against the path segment on every

            request, so Pult must use exactly this value when building the

            `/ws/{ws_id}/...` URL. Today vodopad''s model collapses workspace

            onto user (`UserWorkspaceId::from(UserId)`), but Pult must treat

            this as opaque — surfacing it here keeps callers off the

            `workspace_id == user_id` assumption.'
    UpdateUserVmRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
    VmBootDisk:
      oneOf:
      - $ref: '#/components/schemas/UserStorageId'
      - $ref: '#/components/schemas/CreateUserStorageRequest'
    UserVmDto:
      type: object
      required:
      - id
      - userId
      - clusterId
      - configurationId
      - name
      - status
      - restartRequired
      - allowedActions
      - dataDisks
      - subnets
      - sshKeys
      - networkInterfaces
      - createdAt
      - updatedAt
      properties:
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/VmActionDto'
          description: Operations currently legal for this VM's `status`, derived from the same source as request validation (an advertised action will not 406).
        bootDisk:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserStorageId'
        cloudInit:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CloudInitInfoDto'
        clusterId:
          $ref: '#/components/schemas/ClusterId'
        configurationId:
          $ref: '#/components/schemas/VmConfigurationId'
        configurationName:
          type:
          - string
          - 'null'
          description: Plan name of the VM's configuration; set on list/create responses, omitted elsewhere.
        configurationSlug:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VmConfigurationSlug'
            description: Plan slug of the VM's configuration. See `configuration_name`.
        createdAt:
          type: string
          format: date-time
        dataDisks:
          type: array
          items:
            $ref: '#/components/schemas/UserStorageId'
        expanded:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserVmExpandedDto'
            description: Inlined attached resources, present only for fields named in `?expand=`.
        id:
          $ref: '#/components/schemas/UserVmId'
        lastPaidAt:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type: string
        networkInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/UserVmNetworkInterfaceId'
        paidUntil:
          type:
          - string
          - 'null'
          format: date-time
        priceHourlyUsd:
          type:
          - string
          - 'null'
          description: 'Request-time hourly price snapshot in USD, serialized as a string;

            absent when the catalog has no active price for this resource. A UI

            estimate, not the amount billed.'
          example: '0.05'
        priceMonthlyUsd:
          type:
          - string
          - 'null'
          description: 'Request-time monthly price snapshot in USD (`hourly × 730`), serialized

            as a string. See `price_hourly_usd`.'
          example: '36.50'
        publicIp:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserPublicIpId'
        ramGb:
          type:
          - integer
          - 'null'
          format: u-int64
          description: RAM in GB (decimal) of the VM's configuration. See `configuration_name`.
          minimum: 0
        readySince:
          type:
          - string
          - 'null'
          format: date-time
        restartRequired:
          type: boolean
        sshKeys:
          type: array
          items:
            $ref: '#/components/schemas/UserSshKeyId'
        status:
          $ref: '#/components/schemas/UserVmStatusDto'
        subnets:
          type: array
          items:
            $ref: '#/components/schemas/UserSubnetId'
        terminatedAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          $ref: '#/components/schemas/UserId'
        vcpu:
          type:
          - integer
          - 'null'
          format: u-int8
          description: vCPU count of the VM's configuration. See `configuration_name`.
          minimum: 0
    UserVmId:
      type: string
      format: uuid
    AddPublicIpRequest:
