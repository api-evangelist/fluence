    ConsoleAccessToken:
      type: object
      description: 'Wire-shape returned to Pult. Identical to the response of the previous

        vodopad mint endpoint, which proxied through crd-api

        for the opaque token; only the contents of `token` change here (opaque

        short string → RS256 JWT). Pult treats it as a bearer it forwards to

        vm-api and never parses it.'
      required:
      - token
      - vmApiDomain
      - workspaceId
      - expiresAt
      properties:
        expiresAt:
          type: string
          format: date-time
          description: 'Absolute expiration of the JWT, mirrored from the `exp` claim so the

            client can preemptively re-mint.'
        token:
          type: string
          description: 'RS256 JWT signed with the vodopad `JwtService` RSA key, audience

            `lightmare-vm-api`, issuer `vodopad`. Carries `{sub, vm_id,

            workspace_id, iat, exp, aud, iss}` — see

            [`crate::api::auth::types::VmAccessClaims`].'
        vmApiDomain:
          type: string
          description: 'Public base URL of lightmare vm-api for the cluster this VM lives

            on. Pult builds the attach URL from this + the JWT. Sourced from

            `clusters.vm_api_domain` (migration 1147); if

            the cluster row has NULL the handler answers 503.'
        workspaceId:
          type: string
          format: uuid
          description: 'Workspace the JWT is scoped to — mirrored from the `workspace_id`

            claim. vm-api compares this against the path segment on every

            request, so Pult must use exactly this value when building the

            `/ws/{ws_id}/...` URL. Today vodopad''s model collapses workspace

            onto user (`UserWorkspaceId::from(UserId)`), but Pult must treat

            this as opaque — surfacing it here keeps callers off the

            `workspace_id == user_id` assumption.'
    PaginatedResponse_UserVmDto:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - id
            - userId
            - clusterId
            - configurationId
            - name
            - status
            - restartRequired
            - allowedActions
            - dataDisks
            - subnets
            - sshKeys
            - networkInterfaces
            - createdAt
            - updatedAt
            properties:
              allowedActions:
                type: array
                items:
                  $ref: '#/components/schemas/VmActionDto'
                description: Operations currently legal for this VM's `status`, derived from the same source as request validation (an advertised action will not 406).
              bootDisk:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/UserStorageId'
              cloudInit:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/CloudInitInfoDto'
              clusterId:
                $ref: '#/components/schemas/ClusterId'
              configurationId:
                $ref: '#/components/schemas/VmConfigurationId'
              configurationName:
                type:
                - string
                - 'null'
                description: Plan name of the VM's configuration; set on list/create responses, omitted elsewhere.
              configurationSlug:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/VmConfigurationSlug'
                  description: Plan slug of the VM's configuration. See `configuration_name`.
              createdAt:
                type: string
                format: date-time
              dataDisks:
                type: array
                items:
                  $ref: '#/components/schemas/UserStorageId'
              expanded:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/UserVmExpandedDto'
                  description: Inlined attached resources, present only for fields named in `?expand=`.
              id:
                $ref: '#/components/schemas/UserVmId'
              lastPaidAt:
                type:
                - string
                - 'null'
                format: date-time
              name:
                type: string
              networkInterfaces:
                type: array
                items:
                  $ref: '#/components/schemas/UserVmNetworkInterfaceId'
              paidUntil:
                type:
                - string
                - 'null'
                format: date-time
              priceHourlyUsd:
                type:
                - string
                - 'null'
                description: 'Request-time hourly price snapshot in USD, serialized as a string;

                  absent when the catalog has no active price for this resource. A UI

                  estimate, not the amount billed.'
                example: '0.05'
              priceMonthlyUsd:
                type:
                - string
                - 'null'
                description: 'Request-time monthly price snapshot in USD (`hourly × 730`), serialized

                  as a string. See `price_hourly_usd`.'
                example: '36.50'
              publicIp:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/UserPublicIpId'
              ramGb:
                type:
                - integer
                - 'null'
                format: u-int64
                description: RAM in GB (decimal) of the VM's configuration. See `configuration_name`.
                minimum: 0
              readySince:
                type:
                - string
                - 'null'
                format: date-time
              restartRequired:
                type: boolean
              sshKeys:
                type: array
                items:
                  $ref: '#/components/schemas/UserSshKeyId'
              status:
                $ref: '#/components/schemas/UserVmStatusDto'
              subnets:
                type: array
                items:
                  $ref: '#/components/schemas/UserSubnetId'
              terminatedAt:
                type:
                - string
                - 'null'
                format: date-time
              updatedAt:
                type: string
                format: date-time
              userId:
                $ref: '#/components/schemas/UserId'
              vcpu:
                type:
                - integer
                - 'null'
                format: u-int8
                description: vCPU count of the VM's configuration. See `configuration_name`.
                minimum: 0
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    UserSshKeyId:
      type: string
      format: uuid
    VmNetworkInterfaceDto:
      type: object
      required:
      - id
      - default
      - kind
      properties:
        default:
          type: boolean
        id:
          $ref: '#/components/schemas/UserVmNetworkInterfaceId'
        kind:
          $ref: '#/components/schemas/NetworkInterfaceKindDto'
        securityGroup:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserSecurityGroupId'
    VmConfigurationId:
      type: string
      format: uuid
  securitySchemes:
    access_jwt_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token issued by Fluence
    api_key:
      type: apiKey
      in: header
      name: X-API-KEY
