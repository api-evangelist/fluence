  /v2/vms/{vm_id}/vm-api-access-token:
    post:
      tags:
      - VMs
      operationId: mint_vm_access_token
      parameters:
      - name: vm_id
        in: path
        description: VM the caller wants console access to
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Short-lived JWT and vm-api domain for the attach handshake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleAccessToken'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '404':
          description: VM not found, not owned by the caller, or its cluster no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
        '503':
          description: Cluster has no vm-api gateway configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - access_jwt_token:
        - vms:write
      - api_key:
        - vms:write
      summary: Mint vm access token
      x-summary-source: derived
