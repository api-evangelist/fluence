openapi: 3.2.0
info:
  title: Fluence Prices API
  description: '# Introduction


    The Fluence API gives programmatic access to the decentralized Fluence compute marketplace, letting you find, rent, and

    manage compute resources without the web UI.'
  contact:
    name: Cloudless Labs
  license:
    name: AGPL-3
    identifier: AGPL-3
  version: 0.10.0
security:
- api_key: []
tags:
- name: Prices
  description: Endpoints to get prices for different resources and cost estimation
paths:
  /v1/prices/cost:
    post:
      tags:
      - Prices
      operationId: cost
      requestBody:
        description: Resources to calculate cost
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostRequest'
        required: true
      responses:
        '200':
          description: Cost of resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token:
        - prices:read
      - api_key:
        - prices:read
      summary: Cost
      x-summary-source: derived
  /v1/prices/public-ip:
    get:
      tags:
      - Prices
      operationId: get_public_ip_prices
      parameters:
      - name: clusterId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ClusterId'
      responses:
        '200':
          description: VM prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse_PublicIpPriceInfoDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token:
        - prices:read
      - api_key:
        - prices:read
      summary: Get public ip prices
      x-summary-source: derived
  /v1/prices/storage:
    get:
      tags:
      - Prices
      operationId: get_storage_prices
      parameters:
      - name: clusterId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ClusterId'
      responses:
        '200':
          description: Storage prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse_StoragePriceInfoDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token:
        - prices:read
      - api_key:
        - prices:read
      summary: Get storage prices
      x-summary-source: derived
  /v1/prices/vm:
    get:
      tags:
      - Prices
      operationId: get_vm_prices
      parameters:
      - name: clusterId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ClusterId'
      responses:
        '200':
          description: VM prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse_VmPriceInfoDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token:
        - prices:read
      - api_key:
        - prices:read
      summary: Get vm prices
      x-summary-source: derived
components:
  schemas:
    CollectionResponse_VmPriceInfoDto:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - vmTypeId
            - priceInfo
            properties:
              priceInfo:
                $ref: '#/components/schemas/PriceInfoDto'
              vmTypeId:
                $ref: '#/components/schemas/VmTypeIdDto'
    ErrorBody:
      type: object
      required:
      - error
      - code
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: The stable, machine-readable error code.
        error:
          type: string
          description: The human-readable error message.
    ErrorCode:
      type: string
      description: 'Stable, machine-readable error code carried by every non-2xx response.


        Clients should branch on `code` rather than parsing the human-readable

        `error` string. Status-derived variants cover any error that does not

        supply a more specific code; semantic variants are set explicitly at the

        construction site (see `VodopadError::code`).'
      enum:
      - bad_request
      - unauthorized
      - forbidden
      - not_found
      - conflict
      - unprocessable_entity
      - not_acceptable
      - insufficient_balance
      - service_unavailable
      - internal_server_error
    VmTypeIdDto:
      type: object
      required:
      - vmConfigurationId
      - clusterId
      properties:
        clusterId:
          $ref: '#/components/schemas/ClusterId'
        vmConfigurationId:
          $ref: '#/components/schemas/VmConfigurationId'
    StorageTypeDto:
      type: string
      enum:
      - HDD
      - SSD
      - NVME
    CollectionResponse_StoragePriceInfoDto:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - storageTypeId
            - priceInfo
            properties:
              priceInfo:
                $ref: '#/components/schemas/PriceInfoDto'
              storageTypeId:
                $ref: '#/components/schemas/StorageTypeIdDto'
    PriceInfoDto:
      type: object
      required:
      - pricePerHourPerQty
      properties:
        pricePerHourPerQty:
          type: string
          example: '0.01'
    VmConfigurationId:
      type: string
      format: uuid
    IpAddressType:
      type: string
      enum:
      - V4
      - V6
    PricingResourceTypeDto:
      oneOf:
      - type: object
        required:
        - publicIp
        properties:
          publicIp:
            type: object
            required:
            - resource_id
            properties:
              resource_id:
                $ref: '#/components/schemas/PublicIpTypeIdDto'
      - type: object
        required:
        - storage
        properties:
          storage:
            type: object
            required:
            - resource_id
            - volume_gb
            properties:
              resource_id:
                $ref: '#/components/schemas/StorageTypeIdDto'
              volume_gb:
                type: integer
                format: u-int32
                minimum: 0
      - type: object
        required:
        - vm
        properties:
          vm:
            type: object
            required:
            - resource_id
            properties:
              resource_id:
                $ref: '#/components/schemas/VmTypeIdDto'
    CollectionResponse_PublicIpPriceInfoDto:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - publicIpTypeId
            - priceInfo
            properties:
              priceInfo:
                $ref: '#/components/schemas/PriceInfoDto'
              publicIpTypeId:
                $ref: '#/components/schemas/PublicIpTypeIdDto'
    ClusterId:
      type: string
      format: uuid
    CostRequest:
      type: object
      required:
      - resources
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/PricingResourceTypeDto'
        secs:
          type:
          - integer
          - 'null'
          format: u-int64
          minimum: 0
    CostResult:
      type: object
      required:
      - costOfResources
      - totalCostPerSec
      - periodSecs
      - totalCost
      properties:
        costOfResources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceCostDto'
        periodSecs:
          type: integer
          format: u-int64
          minimum: 0
        totalCost:
          type: string
          example: '0.1'
        totalCostPerSec:
          type: string
          example: '0.01'
    PublicIpTypeIdDto:
      type: object
      required:
      - addressType
      - clusterId
      properties:
        addressType:
          $ref: '#/components/schemas/IpAddressType'
        clusterId:
          $ref: '#/components/schemas/ClusterId'
    StorageTypeIdDto:
      type: object
      required:
      - storageType
      - replicated
      - clusterId
      properties:
        clusterId:
          $ref: '#/components/schemas/ClusterId'
        replicated:
          type: boolean
        storageType:
          $ref: '#/components/schemas/StorageTypeDto'
    ResourceCostDto:
      type: object
      required:
      - resource
      - costPerSec
      properties:
        costPerSec:
          type: string
          example: '0.01'
        resource:
          $ref: '#/components/schemas/PricingResourceTypeDto'
  securitySchemes:
    access_jwt_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token issued by Fluence
    api_key:
      type: apiKey
      in: header
      name: X-API-KEY
