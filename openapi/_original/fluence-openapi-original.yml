s/ErrorBody"},"example":{"code":"unprocessable_entity","error":"Unable to process the entity"}}}},"500":{"description":"Internal Server Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"internal_server_error","error":"Unexpected server error"}}}}},"security":[{"access_jwt_token":[]},{"api_key":["billing:get_spending_history"]}]}},"/v1/billing/top_up":{"post":{"tags":["Billing"],"operationId":"Create top-up request","requestBody":{"description":"Create a new top-up request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TopUpRequest"}}},"required":true},"responses":{"200":{"description":"Top-up request processed successfully","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TopUpDto"}}}},"400":{"description":"Bad Request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"bad_request","error":"Wrong parameters"}}}},"401":{"description":"Unauthorized","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unauthorized","error":"Auth token invalid or missing"}}}},"403":{"description":"Forbidden","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"forbidden","error":"Not allowed to call this endpoint"}}}},"422":{"description":"Unprocessable Entity","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unprocessable_entity","error":"Unable to process the entity"}}}},"500":{"description":"Internal Server Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"internal_server_error","error":"Unexpected server error"}}}}},"security":[{"access_jwt_token":[]},{"api_key":["billing:top_up"]}]}},"/v1/billing/top_up/pending":{"get":{"tags":["Billing"],"operationId":"Get pending top-up","responses":{"200":{"description":"Get pending top-up request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PendingTopUpResponse"}}}},"400":{"description":"Bad Request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"bad_request","error":"Wrong parameters"}}}},"401":{"description":"Unauthorized","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unauthorized","error":"Auth token invalid or missing"}}}},"403":{"description":"Forbidden","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"forbidden","error":"Not allowed to call this endpoint"}}}},"422":{"description":"Unprocessable Entity","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unprocessable_entity","error":"Unable to process the entity"}}}},"500":{"description":"Internal Server Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"internal_server_error","error":"Unexpected server error"}}}}},"security":[{"access_jwt_token":[]},{"api_key":["billing:get_history"]}]}},"/v1/clusters":{"get":{"tags":["Hardware"],"operationId":"Get available clusters","responses":{"200":{"description":"List of available clusters","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CollectionResponse_ClusterDto"}}}},"400":{"description":"Bad Request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"bad_request","error":"Wrong parameters"}}}},"401":{"description":"Unauthorized","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unauthorized","error":"Auth token invalid or missing"}}}},"403":{"description":"Forbidden","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"forbidden","error":"Not allowed to call this endpoint"}}}},"422":{"descripti