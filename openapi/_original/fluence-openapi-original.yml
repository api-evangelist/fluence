":{"description":"Internal Server Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"internal_server_error","error":"Unexpected server error"}}}}},"security":[{"access_jwt_token":["clusters:read"]},{"api_key":["clusters:read"]}]}},"/v1/clusters/{cluster_id}/resources":{"get":{"tags":["Hardware"],"operationId":"get_available_resources","parameters":[{"name":"cluster_id","in":"path","description":"Cluster ID","required":true,"schema":{"$ref":"#/components/schemas/ClusterId"}}],"responses":{"200":{"description":"List of available resources in cluster","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ClusterResourcesDto"}}}},"400":{"description":"Bad Request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"bad_request","error":"Wrong parameters"}}}},"401":{"description":"Unauthorized","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unauthorized","error":"Auth token invalid or missing"}}}},"403":{"description":"Forbidden","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"forbidden","error":"Not allowed to call this endpoint"}}}},"422":{"description":"Unprocessable Entity","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unprocessable_entity","error":"Unable to process the entity"}}}},"500":{"description":"Internal Server Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"internal_server_error","error":"Unexpected server error"}}}}},"security":[{"access_jwt_token":["clusters:read"]},{"api_key":["clusters:read"]}]}},"/v1/configurations/virtual_machines":{"get":{"tags":["Hardware"],"summary":"Raw, unfiltered catalog of *all* VM configurations (every row in\n`crd.vm_configurations`, including unpriced SKUs such as `cpu-shared-*`\nbefore Phase 2 pricing lands). This is intentionally **not** a\n\"what can I buy here\" listing: it has no price-gate, no per-cluster\n`cpu_allocation_ratio`, and no cluster scope. It backs admin/internal\ntooling that needs the full catalog (e.g. assigning prices to a SKU that\nhas none yet) and id->detail lookups for already-created VMs.","description":"The customer-facing, buyable listing — price-gated and ratio-gated per\ncluster — is `GET /v1/clusters/{cluster_id}/resources`\n(`api::hardware::resources::get_available_resources`). Do not treat this\nendpoint as a plan picker; selecting an unpriced SKU here would 404 on\n`POST /v2/vms`.","operationId":"get_vm_configurations","responses":{"200":{"description":"List of available vm configurations","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CollectionResponse_VmConfigurationDto"}}}},"400":{"description":"Bad Request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"bad_request","error":"Wrong parameters"}}}},"401":{"description":"Unauthorized","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unauthorized","error":"Auth token invalid or missing"}}}},"403":{"description":"Forbidden","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"forbidden","error":"Not allowed to call this endpoint"}}}},"422":{"description":"Unprocessable Entity","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unprocessable_entity","error":"Unable to process the entity"}}}},"500":{"description":"Internal Server Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"internal_server_error","error":"Unexpected server error"}}}}},"security":[{"access_jwt_token":["vm:list"]},{"api_key":["vm:list"]}]}},"/v1/datacenters":{"get":{"tags":["Hardware"],"description":"Get a list of datacenters","operationId":"get_datacenters","responses":{"200":{"description":"List Of Datacenters","headers":{"Authorization":{"schema":{"type":"string"},"description":"API Key"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CollectionResponse_DatacenterDto"}}}},"400":{"description":"Bad Request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"bad_request","error":"Wrong parameters"}}}},"401":{"description":"Unauthorized","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unauthorized","error":"Auth token invalid or missing"}}}},"403":{"description":"Forbidden","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"forbidden","error":"Not allowed to call this endpoint"}}}},"422":{"description":"Unprocessable Entity","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unprocessable_entity","error":"Unable to process the entity"}}}},"500":{"description":"Internal Server Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"internal_server_error","error":"Unexpected server error"}}}}},"security":[{"access_jwt_token":["clusters:read"]},{"api_key":["clusters:read"]}]}},"/v1/prices/cost":{"post":{"tags":["Prices"],"operationId":"cost","requestBody":{"description":"Resources to calculate cost","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CostRequest"}}},"required":true},"responses":{"200":{"description":"Cost of resources","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CostResult"}}}},"400":{"description":"Bad Request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"bad_request","error":"Wrong parameters"}}}},"401":{"description":"Unauthorized","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unauthorized","error":"Auth token invalid or missing"}}}},"403":{"description":"Forbidden","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"forbidden","error":"Not allowed to call this endpoint"}}}},"422":{"description":"Unprocessable Entity","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unprocessable_entity","error":"Unable to process the entity"}}}},"500":{"description":"Internal Server Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"internal_server_error","error":"Unexpected server error"}}}}},"security":[{"access_jwt_token":["prices:read"]},{"api_key":["prices:read"]}]}},"/v1/prices/public-ip":{"get":{"tags":["Prices"],"operationId":"get_public_ip_prices","parameters":[{"name":"clusterId","in":"query","required":false,"schema":{"$ref":"#/components/schemas/ClusterId"}}],"responses":{"200":{"description":"VM prices","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CollectionResponse_PublicIpPriceInfoDto"}}}},"400":{"description":"Bad Request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"bad_request","error":"Wrong parameters"}}}},"401":{"description":"Unauthorized","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unauthorized","error":"Auth token invalid or missing"}}}},"403":{"description":"Forbidden","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"forbidden","error":"Not allowed to call this endpoint"}}}},"422":{"description":"Unprocessable Entity","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorBody"},"example":{"code":"unprocessable_entity","error":"Unable to process the entity"}}}},"500":{"description":"Internal Server Error","content":{"applicati