openapi: 3.2.0
info:
  title: Fluence Users API
  description: '# Introduction


    The Fluence API gives programmatic access to the decentralized Fluence compute marketplace, letting you find, rent, and

    manage compute resources without the web UI.'
  contact:
    name: Cloudless Labs
  license:
    name: AGPL-3
    identifier: AGPL-3
  version: 0.10.0
security:
- api_key: []
tags:
- name: Users
  description: Users API endpoints
paths:
  /v1/users/balances/refresh:
    post:
      tags:
      - Users
      operationId: refresh_user_balance
      responses:
        '200':
          description: User entitlement value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementValueDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token: []
      - api_key:
        - ''
      summary: Refresh user balance
      x-summary-source: derived
  /v1/users/me:
    get:
      tags:
      - Users
      operationId: Get current user info
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithScopesDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token: []
      - api_key:
        - ''
      summary: Get current user info
      x-summary-source: derived
  /v1/users/me/profile:
    get:
      tags:
      - Users
      operationId: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token: []
      - api_key:
        - ''
      summary: Get current user profile
      x-summary-source: derived
    patch:
      tags:
      - Users
      operationId: Update current user profile
      requestBody:
        description: Patch current user profile
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
            example:
              company: Cloudless
              firstName: Igor
              jobRole: Designer
              lastName: Ten
        required: true
      responses:
        '200':
          description: Updated current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token: []
      - api_key:
        - ''
      summary: Update current user profile
      x-summary-source: derived
  /v2/users/balances:
    get:
      tags:
      - Users
      operationId: get_user_balance_v2
      parameters:
      - name: entitlementKey
        in: query
        description: 'Keep only the entitlement whose canonical key equals this value, matched

          against `EntitlementValueDto.featureKey` in the response. Omit to return

          every entitlement.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: User entitlement value
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntitlementValueDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: bad_request
                error: Wrong parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unauthorized
                error: Auth token invalid or missing
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: forbidden
                error: Not allowed to call this endpoint
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unprocessable_entity
                error: Unable to process the entity
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: internal_server_error
                error: Unexpected server error
      security:
      - access_jwt_token: []
      - api_key:
        - ''
      summary: Get user balance v2
      x-summary-source: derived
components:
  schemas:
    ErrorBody:
      type: object
      required:
      - error
      - code
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: The stable, machine-readable error code.
        error:
          type: string
          description: The human-readable error message.
    ErrorCode:
      type: string
      description: 'Stable, machine-readable error code carried by every non-2xx response.


        Clients should branch on `code` rather than parsing the human-readable

        `error` string. Status-derived variants cover any error that does not

        supply a more specific code; semantic variants are set explicitly at the

        construction site (see `VodopadError::code`).'
      enum:
      - bad_request
      - unauthorized
      - forbidden
      - not_found
      - conflict
      - unprocessable_entity
      - not_acceptable
      - insufficient_balance
      - service_unavailable
      - internal_server_error
    UserWithScopesDto:
      type: object
      required:
      - id
      - email
      - permissions
      properties:
        email:
          type: string
          example: user@gmail.com
        id:
          type: string
          example: 9ba32273-49e6-4655-b193-b29f61752c2f
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionScope'
          uniqueItems: true
    UserProfileDto:
      type: object
      required:
      - firstName
      - lastName
      - jobRole
      - company
      - updatedAt
      properties:
        company:
          type: string
          example: Cloudless
        firstName:
          type: string
          example: Igor
        jobRole:
          type: string
          example: Designer
        lastName:
          type: string
          example: Ten
        promptAcknowledgedAt:
          type:
          - string
          - 'null'
          example: '2025-01-01T00:00:00.000Z'
        updatedAt:
          type: string
          example: '2025-01-01T00:00:00.000Z'
    PermissionScope:
      type: string
      enum:
      - vm:create
      - vm:remove
      - vm:restart
      - vm:update
      - vm:list
      - token:withdraw
      - token:deposit
      - api_key:create
      - api_key:remove
      - api_key:list
      - ssh_key:create
      - ssh_key:remove
      - ssh_key:activate
      - ssh_key:deactivate
      - ssh_key:list
      - billing:top_up
      - billing:get_history
      - billing:get_spending_history
      - billing:get_spending_aggregated
      - admin:users:read
      - admin:users:write
      - admin:users:whitelist
      - admin:invites:read
      - admin:invites:write
      - admin:peers:write
      - admin:default_images:read
      - admin:default_images:write
      - admin:users:balance:freeze
      - admin:users:balance:increase
      - admin:users:balance:decrease
      - admin:users:balance:limbo
      - admin:users:balance:refund
      - admin:vms:read
      - admin:vms:write
      - admin:peers:read
      - admin:promo_codes:read
      - admin:promo_codes:write
      - admin:basic_configuration:read
      - admin:basic_configuration:create
      - admin:basic_configuration:remove
      - admin:payment_methods:read
      - admin:payment_methods:write
      - admin:payments:read
      - akash:write
      - akash:read
      - spheron:write
      - spheron:read
      - vm:request_access
      - vm:requested_access
      - storage:write
      - storage:read
      - public_ip:write
      - public_ip:read
      - subnet:write
      - subnet:read
      - vpc:write
      - vpc:read
      - security_groups:write
      - security_groups:read
      - admin:security_groups:write
      - admin:security_groups:read
      - admin:storages:read
      - admin:subnets:read
      - admin:public_ips:read
      - admin:vpcs:read
      - admin:storages:write
      - admin:subnets:write
      - admin:public_ips:write
      - admin:vpcs:write
      - clusters:read
      - admin:clusters:read
      - admin:clusters:write
      - admin:prices:read
      - admin:prices:write
      - prices:read
      - vms:read
      - vms:write
    UpdateUserProfileRequest:
      type: object
      properties:
        company:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        jobRole:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
    EntitlementValueDto:
      type: object
      required:
      - balance
      - usage
      - estimatedUsage
      - overage
      - totalDepositedAmount
      - userId
      - featureKey
      properties:
        balance:
          type: string
          example: '100.50'
        estimatedUsage:
          type: string
          example: '100.50'
        featureKey:
          type: string
        overage:
          type: string
          example: '100.50'
        totalDepositedAmount:
          type: string
          example: '100.50'
        usage:
          type: string
          example: '100.50'
        usageDaysLeft:
          type:
          - integer
          - 'null'
          format: u-int16
          minimum: 0
        userId:
          type: string
          example: 9ba32273-49e6-4655-b193-b29f61752c2f
  securitySchemes:
    access_jwt_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token issued by Fluence
    api_key:
      type: apiKey
      in: header
      name: X-API-KEY
