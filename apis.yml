aid: fluence
name: Fluence
description: >-
  Fluence is a decentralized (DePIN) cloud-computing platform offering enterprise-grade CPU and
  GPU compute — virtual machines, GPU containers, and bare-metal instances — rented from a global
  marketplace of independent infrastructure providers at up to 85% below traditional clouds, with
  predictable pricing and zero egress fees. The Fluence API (api.fluence.dev) gives programmatic
  access to the marketplace: search available compute, deploy and manage VMs, attach storage and
  public IPs, configure VPCs, subnets, and security groups, register SSH keys, and handle billing.
  Compute is paid in USDC; the FLT token is used for staking and protocol governance on Fluence's
  Arbitrum Orbit L2 appchain. Backed by Multicoin Capital.
